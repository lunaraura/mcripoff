<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voxel Block Game</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: #20202f;
    }
    canvas {
      display: block;
    }
    #signalUI {
    position: fixed;
    top: 10px;
    left: 10px;
    width: 300px;
    background: rgba(20, 20, 20, 0.9);
    color: white;
    padding: 10px;
    border: 1px solid #888;
    border-radius: 6px;
    font-family: monospace;
    z-index: 1000;
    }

    #signalUI textarea {
    width: 100%;
    height: 100px;
    resize: vertical;
    background: #111;
    color: #0f0;
    margin-bottom: 5px;
    }

    #signalUI button {
    width: 100%;
    margin-bottom: 5px;
    padding: 6px;
    background: #333;
    color: white;
    border: 1px solid #555;
    cursor: pointer;
    }

  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- Three.js from CDN -->
<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/controls/PointerLockControls.js"></script>
<script src="https://unpkg.com/simple-peer@latest/simplepeer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.min.js"></script>

  <!-- Your Game Script -->
  <script src="validator.js"></script>
  <script src="renderer.js"></script>
  <script src="gameLoader.js"></script>
  <script src="movement.js"></script>
  <script src="physics.js"></script>
  <script src="worldgenerator.js"></script>
  <script>
    setupSignalUI();
    initScene();
    animate();
  </script>
</body>
</html>
